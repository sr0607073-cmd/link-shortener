<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Link Shortener & QR Generator</title>
    <style>
        /* Light Theme (Default) */
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f7f6; color: #333; padding: 50px; transition: background 0.3s, color 0.3s; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; width: 100%; transition: background 0.3s; position: relative; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; background: #fff; color: #333; font-size: 14px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; word-break: break-all; }
        img { margin-top: 15px; max-width: 150px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* Copy Button Styling */
        .copy-btn { background: #28a745; font-size: 12px; padding: 5px 10px; margin-left: 10px; display: inline-block; }
        .copy-btn:hover { background: #218838; }
        
        /* Dark Theme Classes */
        body.dark-mode { background: #1e1e1e; color: #f4f7f6; }
        body.dark-mode .card { background: #2d2d2d; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        body.dark-mode input { background: #444; color: #fff; border: 1px solid #555; }
        body.dark-mode a { color: #4da3ff; }
        
        .theme-btn { background: #6c757d; font-size: 14px; padding: 5px 10px; }
    </style>
</head>
<body>

<div class="card">
    <div style="text-align: right;">
        <button class="theme-btn" onclick="toggleDarkMode()">🌓 Toggle Mode</button>
    </div>
    
    <h2>Link Shortener & QR</h2>
    <p>Apna lamba URL paste karein:</p>
    <input type="url" id="longUrl" placeholder="https://example.com">
    <button onclick="processLink()">Generate Now</button>

    <div class="result" id="output"></div>
</div>

<script>
// Dark Mode Toggle Function
function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
}

// Link and QR Generator Function
async function processLink() {
    const longUrl = document.getElementById('longUrl').value;
    const output = document.getElementById('output');
    
    if(!longUrl) { alert('Please enter a URL'); return; }
    
    output.innerHTML = "<p>Processing...</p>";
    
    try {
        // API for Short URL
        const response = await fetch(`https://tinyurl.com{encodeURIComponent(longUrl)}`);
        const shortUrl = await response.text();
        
        // API for QR Code
        const qrUrl = `https://qrserver.com{encodeURIComponent(longUrl)}`;
        
        output.innerHTML = `
            <p style="color: #28a745; font-weight: bold;">Short Link Generated!</p>
            <div style="margin: 10px 0;">
                <a href="${shortUrl}" target="_blank" id="shortUrlText" style="font-weight: bold; font-size: 16px;">${shortUrl}</a>
                <button class="copy-btn" onclick="copyToClipboard('${shortUrl}')" id="copyBtn">📋 Copy</button>
            </div>
            <br>
            <p style="font-weight: bold;">QR Code:</p>
            <img src="${qrUrl}" alt="QR Code">
        `;
    } catch (error) {
        output.innerHTML = "<span style='color:#dc3545; font-weight: bold;'>Error generating link. Try again!</span>";
    }
}

// Copy to Clipboard Function
function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.innerText = "✅ Copied!";
        setTimeout(() => {
            copyBtn.innerText = "📋 Copy";
        }, 2000); // 2 seconds baad wapas text change ho jaye ga
    }).catch(err => {
        alert('Failed to copy text: ', err);
    });
}
</script>

</body>
</html>
